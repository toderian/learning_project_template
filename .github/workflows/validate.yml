name: Validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Markdown lint
        run: |
          python -m pip install PyYAML
          npm install -g markdownlint-cli2

      - name: Validate vault
        run: 12_tools/scripts/validate.sh
